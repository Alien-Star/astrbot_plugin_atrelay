name: astrbot_plugin_atrelay # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 艾特群友转发 # 用于展示的名字
desc: 通过私聊自然语言指挥机器人在 QQ 群内 @ 群友发消息、向指定 QQ 发送私聊消息。支持群名/昵称匹配。 # 插件简短描述
version: v2.0.0 # 插件版本号
author: AlienStar # 作者
repo: https://github.com/Alien-Star/astrbot_plugin_atrelay # 插件的仓库地址
astrbot_version: ">=4.5.0" # 最低兼容的 AstrBot 版本
support_platforms: # 仅支持 QQ (aiocqhttp/OneBot 协议)
  - aiocqhttp
